name: Virasat CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Type Checking (Lint)
        run: npm run lint

      - name: Data Quality & Station Hygiene Audit
        run: |
          npm run check:data
          npm run check:stations

      - name: Production Bundle Compilation
        run: npm run build

      - name: Run Complete Automated Test Suite
        run: npm test

      - name: Secret Hygiene Audit (Frontend Bundle Leak Prevention)
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            let fbKey = "";

            try {
              fbKey = JSON.parse(
                fs.readFileSync("firebase-applet-config.json", "utf-8")
              ).apiKey || "";
            } catch {}

            const files = fs
              .readdirSync("dist/assets")
              .filter(f => f.endsWith(".js"));

            for (const file of files) {
              const content = fs.readFileSync(
                path.join("dist/assets", file),
                "utf-8"
              );

              const sanitized = fbKey
                ? content.replaceAll(fbKey, "")
                : content;

              if (sanitized.includes("AIzaSy")) {
                console.error(
                  "❌ Leaked unauthorized Google API Key detected in: " + file
                );
                process.exit(1);
              }

              if (
                content.includes("postgres://") ||
                content.includes("postgresql://")
              ) {
                console.error(
                  "❌ Leaked database connection string detected in: " + file
                );
                process.exit(1);
              }
            }

            console.log(
              "✓ Secret hygiene audit passed: No unauthorized Google keys or database credentials found in client bundles."
            );
          '