<!-- Drop-in language selector: works on the Heritage tab and on each heritage page -->
<select id="lang" aria-label="Language"></select>
<script>
const LANGS=[["en","English"],["as","অসমীয়া"],["bn","বাংলা"],["brx","बड़ो"],["doi","डोगरी"],["gu","ગુજરાતી"],["hi","हिन्दी"],["kn","ಕನ್ನಡ"],["ks","كٲشُر"],["kok","कोंकणी"],["mai","मैथिली"],["ml","മലയാളം"],["mni","ꯃꯤꯇꯩꯂꯣꯟ"],["mr","मराठी"],["ne","नेपाली"],["or","ଓଡ଼ିଆ"],["pa","ਪੰਜਾਬੀ"],["sa","संस्कृतम्"],["sat","ᱥᱟᱱᱛᱟᱲᱤ"],["sd","سنڌي"],["ta","தமிழ்"],["te","తెలుగు"],["ur","اردو"]];
const RTL=new Set(["ks","sd","ur"]);
const sel=document.getElementById("lang");
LANGS.forEach(([c,n])=>sel.add(new Option(n,c)));
sel.value=localStorage.getItem("lang")||"en";
async function apply(lang){
  localStorage.setItem("lang",lang);
  document.documentElement.lang=lang;
  document.documentElement.dir=RTL.has(lang)?"rtl":"ltr";
  // GET /api/heritages/:slug?lang=xx -> server returns translated fields, falling back to English per field
  window.dispatchEvent(new CustomEvent("langchange",{detail:lang}));
}
sel.onchange=()=>apply(sel.value);
apply(sel.value);
</script>
